[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resonantforge"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.25",
    "click>=8.0",
    "rich>=15.0.0",
    "pytest>=9.0.3",
]

[project.scripts]
rforge = "resonantforge.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["resonantforge"]
